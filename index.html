<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e8f1fb" />
  <title>Our Anniversary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="phase-intro">
  <audio id="bgMusic" loop autoplay muted playsinline webkit-playsinline preload="auto">
    <source src="assets/music.mp3" type="audio/mpeg" />
  </audio>
  <script>
    (function startMusicNow() {
      var audio = document.getElementById("bgMusic");
      if (!audio) return;
      window.__annivWantMusic = true;
      audio.loop = true;
      audio.autoplay = true;
      audio.playsInline = true;
      audio.defaultMuted = false;
      audio.volume = 0.08;

      function playSound() {
        if (window.__annivWantMusic === false) return;
        audio.muted = false;
        var playPromise = audio.play();
        if (playPromise && playPromise.catch) {
          playPromise.catch(function () {
            audio.muted = true;
            audio.play().then(function () {
              audio.muted = false;
              if (audio.paused) {
                audio.muted = true;
                audio.play().catch(function () {});
              }
            }).catch(function () {});
          });
        }
      }

      playSound();
      ["loadeddata", "canplay", "canplaythrough", "playing"].forEach(function (evt) {
        audio.addEventListener(evt, playSound);
      });
      document.addEventListener("DOMContentLoaded", playSound);
      window.addEventListener("load", playSound);
      window.addEventListener("pageshow", playSound);
      ["pointerdown", "pointerup", "touchstart", "touchend", "keydown", "click", "mousemove", "scroll", "wheel"].forEach(function (evt) {
        document.addEventListener(evt, playSound, true);
      });
    })();
  </script>
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-grain"></div>
    <div class="bg-glow bg-glow--one"></div>
    <div class="bg-glow bg-glow--two"></div>
    <div class="bg-petals">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>
    <div class="bg-scatter">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="bg-bottom-art">
      <svg class="bg-bottom-art__svg" viewBox="0 0 1200 220" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
        <g class="flowers" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M120 200c0-40 18-72 42-88 8 28 4 58-12 88H120z" opacity="0.55"/>
          <circle cx="162" cy="98" r="11" opacity="0.7"/>
          <circle cx="148" cy="88" r="8" opacity="0.45"/>
          <circle cx="176" cy="88" r="8" opacity="0.45"/>
          <path d="M162 109v36" opacity="0.5"/>
          <path d="M90 205c12-22 28-34 48-38-6 14-6 30 2 46" opacity="0.4"/>
          <circle cx="78" cy="168" r="9" opacity="0.55"/>
          <path d="M280 205c-8-30 6-58 28-74 10 24 8 50-6 74" opacity="0.5"/>
          <circle cx="308" cy="118" r="10" opacity="0.65"/>
          <circle cx="296" cy="108" r="7" opacity="0.4"/>
          <circle cx="320" cy="108" r="7" opacity="0.4"/>
          <path d="M980 205c0-38 16-68 38-84 8 26 6 54-8 84" opacity="0.55"/>
          <circle cx="1018" cy="108" r="11" opacity="0.7"/>
          <path d="M1018 119v38" opacity="0.45"/>
          <path d="M1050 200c14-18 32-28 52-30-8 16-8 34 0 50" opacity="0.4"/>
          <circle cx="1110" cy="165" r="9" opacity="0.55"/>
        </g>
        <g class="cats" fill="currentColor">
          <g transform="translate(420 145)" opacity="0.88">
            <ellipse cx="52" cy="58" rx="46" ry="34"/>
            <circle cx="52" cy="34" r="26"/>
            <polygon points="30,18 24,2 40,14"/>
            <polygon points="74,18 80,2 64,14"/>
            <circle cx="42" cy="32" r="3.5" fill="#e8f1fb"/>
            <circle cx="62" cy="32" r="3.5" fill="#e8f1fb"/>
            <path d="M46 42q6 6 12 0" fill="none" stroke="#e8f1fb" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M18 58c-10 8-14 20-10 32 14-6 24-16 28-30" opacity="0.85"/>
            <path d="M86 58c10 8 14 20 10 32-14-6-24-16-28-30" opacity="0.85"/>
          </g>
          <g transform="translate(640 152) scale(0.82)" opacity="0.75">
            <ellipse cx="52" cy="58" rx="46" ry="34"/>
            <circle cx="52" cy="34" r="26"/>
            <polygon points="30,18 24,2 40,14"/>
            <polygon points="74,18 80,2 64,14"/>
            <circle cx="42" cy="32" r="3.5" fill="#e8f1fb"/>
            <circle cx="62" cy="32" r="3.5" fill="#e8f1fb"/>
            <path d="M48 41q4 5 8 0" fill="none" stroke="#e8f1fb" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M20 70l-8 14M84 70l8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
          </g>
        </g>
      </svg>
    </div>
  </div>

  <header class="top-bar">
    <p class="progress-label" id="progressLabel" aria-live="polite">Loading…</p>
    <button type="button" class="icon-btn" id="musicToggle" aria-pressed="false" aria-label="Play background music">
      <span class="icon-btn__off" aria-hidden="true">♪</span>
      <span class="icon-btn__on" aria-hidden="true">♫</span>
    </button>
  </header>

  <div class="intro-layer" id="introLayer">
    <div class="intro-stage-wrap">
      <div class="intro-stage" id="introStage" aria-live="polite"></div>
    </div>
    <div class="intro-timer" aria-hidden="true"><span id="introTimerBar"></span></div>
  </div>

  <main class="stage-wrap is-hidden" id="stageWrap">
    <div class="stage" id="stage" role="region" aria-label="Anniversary month slides"></div>
  </main>

  <nav class="nav-controls is-hidden" id="navControls" aria-label="Month navigation">
    <button type="button" class="nav-btn" id="prevBtn" disabled aria-label="Previous month">
      <span aria-hidden="true">←</span> Prev
    </button>
    <div class="dots" id="dots" role="tablist" aria-label="Months"></div>
    <button type="button" class="nav-btn nav-btn--primary" id="nextBtn" aria-label="Next month">
      Next <span aria-hidden="true">→</span>
    </button>
  </nav>

  <section class="epilogue-layer is-hidden" id="epilogueLayer" aria-label="Closing message">
    <div class="epilogue-stage" id="epilogueStage"></div>
    <button type="button" class="nav-btn nav-btn--primary epilogue-restart" id="restartBtn">Restart</button>
  </section>

  <section class="final-layer is-hidden" id="finalLayer" aria-label="Final message">
    <div class="final-stage-wrap">
      <div class="final-stage" id="finalStage"></div>
    </div>
    <nav class="final-nav" id="finalNav" aria-label="Final message pages">
      <button type="button" class="nav-btn" id="finalPrevBtn" disabled aria-label="Previous page">
        <span aria-hidden="true">←</span> Prev
      </button>
      <p class="final-page-label" id="finalPageLabel" aria-live="polite"></p>
      <button type="button" class="nav-btn nav-btn--primary" id="finalNextBtn" aria-label="Next page">
        Next <span aria-hidden="true">→</span>
      </button>
    </nav>
  </section>

  <div class="final-measure" id="finalMeasure" aria-hidden="true"></div>

  <div class="confetti-container" id="confettiContainer" aria-hidden="true"></div>

  <p class="load-error hidden" id="loadError" role="alert"></p>

  <script src="js/app.js" type="module"></script>
</body>
</html>
